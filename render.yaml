services:
  - type: web
    name: upi-gateway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: PING_TOKEN
        generateValue: true
